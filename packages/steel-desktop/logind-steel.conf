# logind policy.
#
# The setting that matters here is lock-on-suspend. CLAUDE.md calls this out as
# a common silent failure: systemd-homed locks a home when the session locks on
# sleep, but only if logind actually reports the sleep — and a desktop
# environment that handles the lid switch itself, or a masked sleep hook, breaks
# that chain without any error.
#
# An unlocked home on a suspended laptop is an unlocked laptop. The threat model
# lists device theft while powered off; a suspended machine is not powered off,
# and this is the difference between the two.
#
# HandleLidSwitch=suspend rather than =lock: suspending clears more of the
# session state and triggers the homed lock path. Locking without suspending
# leaves the volume key in RAM with the screen locked, which is a much weaker
# position.

[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Lock the session after 10 minutes idle, then suspend. Short enough to matter
# in a café, long enough not to interrupt reading.
IdleAction=lock
IdleActionSec=10min

# Do not let a user's lingering services keep running after logout: they hold
# the home unlocked, which defeats the per-user encryption boundary the moment
# someone logs out and walks away.
KillUserProcesses=yes
KillExcludeUsers=root
