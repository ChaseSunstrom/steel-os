# Mount options for removable media.
#
# A USB stick is the most common physical delivery vector there is, and the
# desktop mounts one automatically the moment it is plugged in. Without this,
# that mount is executable and honours setuid bits and device nodes on a
# filesystem an attacker controls completely.
#
# nosuid is the one that matters most: a setuid-root binary on a filesystem
# anyone can write is a local root escalation with no exploit required.
#
# The cost: portable applications and installers on USB media stop working, with
# a "permission denied" that does not say why. `steel-harden removable-noexec
# off` is the escape hatch, and docs/escape-hatches.md maps the symptom.

[defaults]
defaults=nosuid,nodev,noexec
allow=exec,noexec,nodev,nosuid,atime,noatime,nodiratime,ro,rw,sync,dirsync,noload

[vfat]
defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,showexec,flush,nosuid,nodev,noexec

[exfat]
defaults=uid=$UID,gid=$GID,iocharset=utf8,errors=remount-ro,nosuid,nodev,noexec

[ntfs]
defaults=uid=$UID,gid=$GID,windows_names,nosuid,nodev,noexec

[ext4]
defaults=nosuid,nodev,noexec
