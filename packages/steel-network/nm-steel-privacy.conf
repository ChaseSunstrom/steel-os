# NetworkManager privacy defaults.
#
# A hardware MAC address is a permanent identifier that the machine broadcasts
# to every network in range, whether or not it connects. Without randomisation
# it links every café, airport, and office you have visited into one trail, and
# nothing in the OS above this layer can undo that.
#
# Two separate settings, because they defend different things:
#
#   wifi.scan-rand-mac-address   randomises the address used while *scanning*.
#                                This is what stops passive trackers logging
#                                your presence in a shop you never joined.
#
#   wifi.cloned-mac-address      randomises the address used while *connected*.
#                                `stable` derives a per-network address that
#                                persists, so the network sees a consistent
#                                device (captive portals and MAC-based auth
#                                keep working) while different networks cannot
#                                correlate you. `random` re-rolls every
#                                connection, which is stronger and breaks both
#                                of those.
#
# We default to `stable` for connections and full randomisation for scanning:
# `random` makes portal logins fail on reconnect, and a user who hits that
# turns the whole thing off. `steel-network mac random` for the stronger
# setting, `steel-network mac stable-hw` to go back to the hardware address.

[connection]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
# Re-roll the stable address every 24h so a long-lived association does not
# become a long-lived identifier.
connection.stable-id=${CONNECTION}/${BOOT}

[device]
wifi.scan-rand-mac-address=yes

[main]
# Do not hand the hostname to the DHCP server: it is usually the user's name
# and it is sent in the clear to every network joined.
hostname-mode=none

[ipv6]
# Privacy extensions: prefer a temporary address for outbound connections so the
# interface identifier is not a stable device fingerprint. The sysctl baseline
# sets this at the kernel level too; NetworkManager overrides per-connection, so
# it has to be set in both places or the kernel setting is silently undone.
ip6-privacy=2
