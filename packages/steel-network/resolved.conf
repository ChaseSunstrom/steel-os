# DNS over TLS, strict.
#
# DNSOverTLS=yes rather than =opportunistic. Opportunistic silently falls back
# to plaintext when port 853 does not answer, which means an on-path attacker
# who blocks 853 gets exactly what they wanted and the user is told nothing.
# A setting that fails open is not a security setting.
#
# The cost is captive portals: with strict DoT and no portal handling, hotel and
# airport wifi appears completely broken. That is why steel-network also ships a
# captive-portal helper — CLAUDE.md is explicit that a usability failure here is
# a security failure, because the user's fix is to disable DNS security
# permanently.
#
# DNSSEC=allow-downgrade rather than =yes: full DNSSEC validation in resolved
# still breaks a long tail of misconfigured domains, and a user who hits one
# turns DNSSEC off entirely. allow-downgrade validates where it can.
#
# The provider is chosen at install time. Quad9 is the default because it does
# not log, filters known-malicious domains, and is operated by a Swiss
# non-profit rather than an advertising company — but this is a value judgement
# and the installer offers Cloudflare, Mullvad, and a custom entry.

[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=yes
DNSSEC=allow-downgrade

# Do not fall back to whatever DHCP nominated when the configured servers fail.
# The fallback is the failure mode this file exists to prevent.
FallbackDNS=

# mDNS and LLMNR answer queries from the local network, which is a scanning
# surface on any network you do not control.
MulticastDNS=no
LLMNR=no

# Cache negative answers for less time than positive ones: a captive portal
# poisons the cache with failures, and a long negative TTL means DNS stays
# broken for minutes after the portal is cleared.
CacheFromLocalhost=no
