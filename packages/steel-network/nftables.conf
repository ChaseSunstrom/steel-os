#!/usr/bin/nft -f
#
# SteelOS default firewall.
#
# Policy: drop inbound, drop forwarded, allow outbound. Threat model: local
# network attacker — hotel wifi, a conference network, a compromised router.
# The point is that a service you did not mean to start is not reachable.
#
# Outbound is allowed rather than filtered. Per-application egress control is
# the sandbox layer's job (Flatpak, bubblejail, and Trrod's per-app namespaces);
# doing it here with a port-based ruleset would produce a rule set nobody can
# read and no meaningful confinement, because every application can speak on 443.
# `steel-network killswitch on` switches output to drop for the VPN case, where
# the property being defended is different and a coarse rule does work.
#
# Local additions go in /etc/nftables.d/*.nft — included at the end, after the
# defaults, so a local rule can add an accept but the base policy still applies
# to anything it does not mention.

flush ruleset

table inet steel {
    # Sets are here so `steel-network allow <port>` has somewhere to write
    # without editing rules, which keeps the generated file stable and makes
    # the exceptions greppable.
    set allowed_tcp {
        type inet_service
        flags interval
    }

    set allowed_udp {
        type inet_service
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Established traffic first: this is the bulk of the packets, and
        # matching it early keeps the rest of the chain off the hot path.
        ct state established,related accept
        ct state invalid drop

        iif lo accept

        # ICMP is required for path MTU discovery. Dropping it does not improve
        # security and does break large transfers over tunnels in ways that are
        # very hard to diagnose. Rate-limited rather than blocked.
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept

        # ICMPv6 is not optional: neighbour discovery is how IPv6 works at all.
        # Blocking it does not harden anything, it turns IPv6 off in a confusing way.
        ip6 nexthdr icmpv6 icmpv6 type {
            destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
            nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert
        } accept
        ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 10/second accept

        # DHCPv6 and mDNS/LLMNR are deliberately NOT opened. Service discovery
        # on an untrusted network is a scanning surface, and the desktop works
        # without it. `steel-network allow 5353/udp` for a home network.

        tcp dport @allowed_tcp ct state new accept
        udp dport @allowed_udp accept

        # Log what we drop, slowly. Without this, "the firewall broke it" is
        # unfalsifiable and users turn the firewall off to test the theory.
        limit rate 5/minute burst 5 packets log prefix "steel-fw drop-in: " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Container and VM bridges add their own accept rules to this chain at
        # runtime. Leaving the policy at drop means anything they do not
        # explicitly permit is still refused.
        ct state established,related accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

include "/etc/nftables.d/*.nft"
