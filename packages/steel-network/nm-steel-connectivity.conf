# Captive portal detection.
#
# This is not a hardening measure. It is the thing that keeps a hardening
# measure from being disabled.
#
# With DNSOverTLS=yes and no portal handling, joining hotel wifi looks like
# this: everything times out, no browser page appears, and there is no
# indication why. The user's fix — the only one they can find — is to turn off
# DNS security, and it stays off afterwards. CLAUDE.md is explicit that this
# counts as a security failure, not a papercut.
#
# The connectivity check is a plain HTTP request to a known URL. That is a small
# privacy cost: it tells whoever operates the endpoint that this machine joined
# a network, at a rough time. We point it at our own endpoint rather than
# NetworkManager's default so the disclosure goes to us rather than to a third
# party, and users can change it. `steel-network connectivity off` disables it
# entirely, at the cost of portal networks not working.

[connectivity]
uri=http://connectivity.steelos.invalid/check
response=STEELOS-ONLINE
interval=300
