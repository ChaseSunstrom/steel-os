# SteelOS kernel hardening baseline.
#
# This file is the deployed half of a contract. The other half is
# SYSCTL_BASELINE in tools/steel-check/src/checks/kernel.rs, which lists the
# same keys with the rationale for each, and a unit test fails the build if the
# two drift apart. Do not edit one without the other.
#
# To override a value, drop a file into /etc/sysctl.d/ that sorts after this one
# (it is 99-, so use 99-zz- or similar) — or better, use `steel-harden sysctl
# <key> off`, which records the exception where steel-check can report it.

# --- Kernel information leaks -------------------------------------------------
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.printk = 3 3 3 3
kernel.perf_event_paranoid = 3

# --- Attack surface reduction -------------------------------------------------
kernel.kexec_load_disabled = 1
# 176 = sync(16) + remount-ro(32) + reboot(128). The debug dumps and process
# signalling functions are a console-attacker escalation; the recovery
# combinations are not.
kernel.sysrq = 176
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
dev.tty.ldisc_autoload = 0
vm.unprivileged_userfaultfd = 0

# --- Process and memory -------------------------------------------------------
kernel.randomize_va_space = 2
# 2 = only a declared parent may ptrace. The strict preset raises this to 3,
# which disables ptrace entirely and cannot be relaxed without a reboot.
kernel.yama.ptrace_scope = 2
fs.suid_dumpable = 0
kernel.core_pattern = |/bin/false

# --- Filesystem races ---------------------------------------------------------
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# --- Network ------------------------------------------------------------------
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# The IPv6 knob is a tri-state; -1 is "disabled", 0 is "accept without routing".
net.ipv6.conf.all.accept_source_route = -1
# Privacy addresses: without these the interface identifier is a stable,
# passively-observable device fingerprint across every network you join.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
