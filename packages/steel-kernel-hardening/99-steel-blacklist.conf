# SteelOS module blacklist.
#
# Paired with BLACKLISTED_MODULES in tools/steel-check/src/checks/kernel.rs; a
# unit test fails the build if they drift apart.
#
# `install <mod> /bin/false` rather than `blacklist <mod>`: blacklist only stops
# automatic loading by alias, and anything that asks for the module by name
# still gets it. The install form refuses in both cases.
#
# To allow one back: `steel-harden module <name> allow`.

# --- Rare filesystems ---------------------------------------------------------
# Reachable by plugging in a USB stick: the kernel probes the superblock and
# loads the driver before any policy sees the device.
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false

# In-kernel SMB server. A desktop should not be running one, and it has had
# pre-auth remote code execution.
install ksmbd /bin/false

# --- Legacy network protocols -------------------------------------------------
# Reachable from an unprivileged socket() call, so any compromised application
# can load them. Large, lightly-maintained code with a long CVE history.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n-hdlc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install decnet /bin/false
install econet /bin/false
install af_802154 /bin/false
install ipx /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8023 /bin/false
install p8022 /bin/false
install can /bin/false
install atm /bin/false

# --- DMA over external ports --------------------------------------------------
# FireWire grants a device direct read/write access to host memory. The IOMMU
# mitigates this; not having the driver at all removes it.
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false

# --- Miscellaneous ------------------------------------------------------------
# vivid is a video test driver that ships enabled in many kernel configs and has
# produced several local privilege escalations. Nothing in production needs it.
install vivid /bin/false
# Direct model-specific register access from userspace.
install msr /bin/false
