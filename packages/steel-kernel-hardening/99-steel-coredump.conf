# No process may produce a core dump.
#
# kernel.core_pattern already sends dumps to /bin/false, which discards them.
# This is the second layer: a hard RLIMIT_CORE of 0 means the kernel never
# generates the dump in the first place, so there is no window in which the
# contents exist anywhere.
#
# Why this matters more than it sounds: a core dump is a verbatim copy of a
# process's address space. For a browser that is every session cookie; for
# gpg-agent or the keyring it is the keys themselves. The default behaviour
# writes that to disk, outside the user's control, at the least convenient
# moment.
#
# To re-enable for debugging: `steel-harden coredumps on`.

*  hard  core  0
