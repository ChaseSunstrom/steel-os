# Strict-preset additions to the module blacklist.
#
# These cost real functionality, which is why they are not in the baseline.
# Installed only when the hardening preset is `strict`.

# Thunderbolt is a DMA-capable external port. The IOMMU plus Thunderbolt
# security levels handle the common case; removing the driver handles the rest,
# at the cost of every dock, eGPU, and Thunderbolt display on the machine.
install thunderbolt /bin/false
