# Unprivileged user namespaces: deliberately ENABLED.
#
# This is a documented divergence from most Linux hardening guides, which
# disable user namespaces because they have been a recurring source of local
# privilege escalation.
#
# We keep them because every unprivileged sandbox on this system depends on
# them — Flatpak, bubblejail, and steel-shell all use unprivileged bubblewrap.
# The alternative is a SUID-root sandbox helper, which means a bug in the
# sandbox is a root escalation instead of a sandbox escape. That is a worse
# trade for a desktop whose primary threat is a malicious document or website.
#
# The counterargument, and how to act on it, is in
# docs/rationale/user-namespaces.md. To disable: `steel-harden userns off`.
#
# This lives in its own file rather than in 99-steel-hardening.conf because it
# is a decision, not a baseline value, and it should be readable as one.
user.max_user_namespaces = 10000
