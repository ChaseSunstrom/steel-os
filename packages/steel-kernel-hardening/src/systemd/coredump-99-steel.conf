# systemd-coredump: store nothing.
#
# Belt and braces alongside kernel.core_pattern and the RLIMIT_CORE limit. If a
# later package or a user re-points core_pattern at systemd-coredump, this keeps
# the contents from reaching /var/lib/systemd/coredump.
#
# ProcessSizeMax=0 stops systemd-coredump from even reading the process image,
# so nothing transits through memory it controls either.

[Coredump]
Storage=none
ProcessSizeMax=0
