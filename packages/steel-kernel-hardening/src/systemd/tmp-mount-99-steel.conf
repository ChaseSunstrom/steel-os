# /tmp as a tmpfs with nodev,nosuid,noexec.
#
# tmpfs means nothing in /tmp survives a reboot, which bounds how long a dropped
# payload can live there. noexec stops the direct `chmod +x && ./payload` path;
# it does not stop an interpreter running a script, and we do not claim it does.
# It is worth having anyway because a large fraction of off-the-shelf tooling
# does exactly the thing it blocks.
#
# The cost is real: some build systems, and several proprietary installers,
# extract to /tmp and execute from it. They will fail with a confusing "permission
# denied". `steel-harden tmp-noexec off` is the fix, and
# docs/escape-hatches.md maps the error message to it.
#
# Note the size default: tmpfs on /tmp comes out of RAM. systemd's default of
# 50% of physical memory is kept rather than overridden — lowering it breaks
# large builds, raising it invites the OOM killer.

[Mount]
Options=mode=1777,strictatime,nosuid,nodev,noexec
