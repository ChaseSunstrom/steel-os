# The first page, and the last chance to stop someone installing onto a machine
# that cannot run this.
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true
showDonateUrl:          false

requirements:
    requiredStorage:    64
    requiredRam:        4
    check:
        - ram
        - root
        - screen
    required:
        - ram
        - root

# 'storage' is deliberately absent. Calamares evaluates it through libparted,
# which the build we ship does not have, so it warns on every start and reports
# nothing. The disk page does the real check: it reads the actual block devices,
# knows the 64 GB minimum comes from two root slots plus two verity trees plus
# the always-allocated custody and decoy regions, and refuses a disk that is too
# small with that reason attached.
#
# 'internet' is absent too, and there is no internetCheckUrl. A probe would mean
# this installer contacts a third party before the user has chosen a DNS
# provider or seen the firewall, which is the wrong first act for a system whose
# premise is that you can see what it does.
