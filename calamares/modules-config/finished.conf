# The post-install checklist screen.
#
# The items on it are the things this installer cannot do for the user and that
# nobody will do later if they are not told now: set a firmware admin password,
# re-enable Secure Boot, turn on memory encryption if the CPU has it and the
# firmware does not, and store the recovery sheet somewhere other than here.
---
restartNowMode: user-unchecked
restartNowCommand: "systemctl -i reboot"
notifyOnFinished: false
