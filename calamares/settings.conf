# SteelOS installer sequence.
#
# Design principle 1: "Secure by default, not by tutorial. Everything here must
# be the default state after a normal GUI install. No post-install hardening
# checklist."
#
# So the order below is not arbitrary. Each step runs where the user still has
# the context to make its decision, and none of them can be skipped into a
# less-safe state by clicking Next.
#
# Two things about the shape of this file:
#
#   * The SteelOS pages are instances of one small view module, `steelospage`,
#     whose entire job is to let a QML page refuse to go forward. Calamares 3.4
#     has no Python view modules — PythonQt is gone — and QML alone cannot gate
#     the Next button: ViewManager's slot checks sender(), so a direct call from
#     QML does nothing. See calamares/viewmodule for the ten lines that matter.
#     The pages themselves are all QML, in branding/steelos/steelos-*.qml.
#
#   * The exec phase is ours, not Calamares'. SteelOS's disk layout is A/B root
#     slots with verity trees, an always-allocated custody region and a decoy
#     region, none of which Calamares' partition module can express. We
#     partition with systemd-repart against the same definitions the image
#     build uses, and then hand `rootMountPoint` back so the stock localecfg,
#     keyboard, hwclock and machineid jobs work normally.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:      disk
  module:  steelospage
  config:  steelospage-disk.conf
- id:      bootsec
  module:  steelospage
  config:  steelospage-bootsec.conf
- id:      hardening
  module:  steelospage
  config:  steelospage-hardening.conf
- id:      graphics
  module:  steelospage
  config:  steelospage-graphics.conf
- id:      profiles
  module:  steelospage
  config:  steelospage-profiles.conf
- id:      netprivacy
  module:  steelospage
  config:  steelospage-netprivacy.conf
- id:      backup
  module:  steelospage
  config:  steelospage-backup.conf
- id:      threatened
  module:  steelospage
  config:  steelospage-threatened.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  # Disk before boot security: the partition layout determines whether TPM
  # binding and the custody region are even possible.
  - steelospage@disk
  - steelospage@bootsec
  - steelospage@hardening
  - steelospage@graphics
  - steelospage@profiles
  - steelospage@netprivacy
  - steelospage@backup
  # The threatened-user step is LAST of the optional ones and is opt-in. It
  # walks through limits with a comprehension confirmation rather than an
  # "I agree" box, because the failure modes are irreversible.
  - steelospage@threatened
  - summary

- exec:
  - steelos_partition
  - steelos_deploy
  # Stock jobs, working against the rootMountPoint steelos_deploy set.
  - localecfg
  - keyboard
  - hwclock
  - machineid
  - steelos_hardening
  - steelos_bootsec
  - steelos_profiles
  - steelos_netprivacy
  - steelos_backup
  - steelos_threatened
  # Last, and it can fail the install: an installed system that does not audit
  # green has not been installed correctly, and finding that out now is much
  # cheaper than finding it out on first boot.
  - steelos_verify
  - steelos_unmount

- show:
  - finished

branding: steelos

# No "install alongside" or "erase disk and encrypt" shortcuts. SteelOS
# allocates the whole disk, always — unallocated regions with high-entropy data
# are a forensic signal, and a partition table that varies between installs
# undermines the deniability design for everyone.
prompt-install: true

# Everything we do runs against a mounted target with explicit paths rather
# than inside a chroot: the target's /usr is a read-only verity image and
# cannot host a chroot that writes anything.
dont-chroot: true
oem-setup: false
disable-cancel: false
# Cancelling DURING the write phase leaves a half-installed disk. Better to
# disable it there than to leave someone with a machine that neither boots nor
# has their old system.
disable-cancel-during-exec: true
# Keep the navigation visible while the install runs, greyed out. Hiding it
# makes a long step look like a hang.
hide-back-and-next-during-exec: false
# The finished page offers the reboot; quitting straight out of the exec phase
# would skip the post-install checklist, which is the only place several
# firmware-side steps are ever mentioned.
quit-at-end: false
