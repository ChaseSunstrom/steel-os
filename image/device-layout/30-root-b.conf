# Root image slot B.
#
# Populated by the installer (slot A) and by updates (the inactive slot). Both
# slots are allocated at install time so an update always has somewhere to go —
# a machine with one populated slot has no rollback target, which is precisely
# the state rollback exists for.
[Partition]
Type=root
Label=steelos-root-b
SizeMinBytes=6G
SizeMaxBytes=6G
ReadOnly=yes
