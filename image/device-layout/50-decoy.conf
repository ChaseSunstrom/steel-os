# Decoy volume.
#
# Allocated on EVERY install, decoy or not, and filled with random data when
# unused. This is the single highest-value item in the deniability design and it
# cannot be retrofitted convincingly later — a machine that added a decoy
# partition afterwards has a partition table visibly different from the one it
# shipped with.
#
# Because every SteelOS disk has this partition full of high-entropy data, a
# second LUKS volume here occupies space that already looked exactly like this
# on every other machine.
#
# PaddingMinBytes rather than a fixed size so the proportion is consistent
# across disk sizes: a fixed 200 GiB decoy on a 256 GiB disk would be its own
# anomaly.
[Partition]
Type=linux-generic
Label=steelos-decoy
SizeMinBytes=16G
SizeMaxBytes=200G
Weight=200
