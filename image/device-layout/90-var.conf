# Writable state: /var, and /home beneath it.
#
# LUKS2 with argon2id. Everything the system writes lives here, which is what
# makes "an attacker has nowhere to persist outside this volume" a checkable
# statement.
#
# Takes the remainder of the disk. The installer allocates the ENTIRE disk and
# fills anything left over with random data — unallocated regions with
# high-entropy content are a forensic signal, and having none is better than
# having some.
[Partition]
Type=var
Label=steelos-var
Format=btrfs
Encrypt=key-file
Weight=1000
SizeMinBytes=16G
FactoryReset=no
