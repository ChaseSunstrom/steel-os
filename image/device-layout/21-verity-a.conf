# Verity hash tree for slot A.
#
# Sized generously and fixed: the tree for a 6 GiB image is roughly 48 MiB, and
# a fixed allocation means the partition table is identical across installs
# regardless of how well a particular image compressed.
[Partition]
Type=root-verity
Label=steelos-verity-a
SizeMinBytes=64M
SizeMaxBytes=64M
ReadOnly=yes
