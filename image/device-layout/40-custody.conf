# Custody region.
#
# 4 MiB of random data on EVERY install. On a machine with steel-custody
# enrolled it holds the wrapped volume key and share identifiers; on every other
# machine it stays random fill.
#
# The initramfs needs this material before anything is decrypted, so it cannot
# live inside the encrypted volume. Which means it must exist everywhere, or its
# existence identifies the machines that use it. Presence proves nothing; that
# is the entire design.
#
# The size is fixed and checked (steel-check duress.custody-region). A region
# whose size differs from every other install is itself a distinguishing
# feature.
[Partition]
Type=linux-generic
Label=steelos-custody
SizeMinBytes=4M
SizeMaxBytes=4M
Encrypt=off
