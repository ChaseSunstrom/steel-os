# Signature over the verity root hash.
#
# systemd-veritysetup can verify the root hash against a signature in the
# kernel keyring, which gives a second, independent path to the same guarantee:
# even if something were able to influence the cmdline, the signed root hash
# still has to match.
#
# Belt and braces on the single most load-bearing property in the design.

[Partition]
Type=root-verity-sig
Label=steelos-veritysig
VerityMatchKey=root
