# Root image.
#
# erofs: read-only by construction, compact, and with a deterministic layout
# given a fixed block size — which reproducibility needs.
#
# 6 GiB. The build produces ONE root image; the A/B duplication lives in the
# installed machine's partition table (image/device-layout/), and an update
# writes this image into whichever slot is inactive. Building two identical
# images would only create the opportunity for them to differ.
#
# Two 6 GiB slots plus the ESP and a usable /var puts the documented minimum
# disk at 64 GiB. Sizing this deliberately is CLAUDE.md gotcha 3; the failure
# mode of getting it wrong is an update that cannot be staged on a machine that
# has been running fine for a year.

[Partition]
Type=root
Label=steelos-root
Format=erofs
Minimize=off
SizeMinBytes=6G
SizeMaxBytes=6G
# Read-only at the partition level as well as the mount level. Belt and braces:
# the verity layer is the actual guarantee, but a partition flagged read-only
# fails earlier and more clearly when something tries to write it.
ReadOnly=yes
Verity=data
VerityMatchKey=root
