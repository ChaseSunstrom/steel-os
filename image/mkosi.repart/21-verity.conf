# dm-verity hash tree for the root image.
#
# The hash tree is what makes offline modification detectable: the kernel checks
# every block of the root image against it on read, so a tampered block fails at
# the moment it is read rather than silently serving attacker content.
#
# The root hash produced here is the value that gets embedded in the UKI's
# command line and signed. Verity with an attacker-chosen root hash verifies the
# attacker's image perfectly — the property that matters is not "verity is on",
# it is "the root hash came from the signed UKI". steel-check's
# storage.verity-roothash-matches-uki is the check for exactly that.

[Partition]
Type=root-verity
Label=steelos-verity
Verity=hash
VerityMatchKey=root
Minimize=best
