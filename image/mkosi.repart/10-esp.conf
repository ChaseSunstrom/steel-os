# EFI System Partition.
#
# Size: 1 GiB. That is generous for an ESP, and deliberately so — it holds two
# deployment UKIs, a recovery UKI, a maintenance UKI, and their staged
# replacements during an update. A UKI with linux-hardened, NVIDIA firmware, and
# Plymouth is not small, and running out of ESP space mid-update is a bad
# failure: it leaves a machine with one bootable deployment and no way to stage
# a fix.
#
# CLAUDE.md gotcha 5: some firmware chokes on large PE binaries. That is a
# separate problem from ESP capacity and is handled by trimming firmware to
# detected hardware in build.sh.
#
# DENIABILITY CONSTRAINT: the ESP is unencrypted and is the first thing an
# examiner reads. Its size, layout, and entry set must be identical on every
# SteelOS install. Nothing about which volumes exist may be recorded here.

[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
SizeMinBytes=1G
SizeMaxBytes=1G
