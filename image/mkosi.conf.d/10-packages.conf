# Packages baked into the verified root.
#
# The rule for what belongs here, from CLAUDE.md: image rebuilds are for the
# kernel, drivers, base system, and hardening posture only. If a user's need can
# be met by Flatpak, a container, or a signed sysext, it must NOT require an
# image rebuild. Get this wrong and the OS feels hostile and people leave.
#
# So: no applications beyond a browser and the tools needed to recover a broken
# machine. Everything else is Flatpak or steel-shell.

[Content]
Packages=
        # --- base system -----------------------------------------------------
        base
        linux-hardened
        linux-firmware
        systemd
        systemd-ukify
        systemd-resolvconf
        btrfs-progs
        erofs-utils
        cryptsetup
        dosfstools
        e2fsprogs

        # --- boot chain ------------------------------------------------------
        sbctl
        tpm2-tools
        tpm2-tss
        plymouth

        # --- SteelOS ---------------------------------------------------------
        steel-base
        steel-boot
        steel-config
        steel-check
        steel-kernel-hardening
        steel-malloc
        steel-network
        steel-sandbox
        steel-apparmor
        steel-desktop
        steel-duress
        steel-backup

        # --- security --------------------------------------------------------
        apparmor
        audit
        hardened_malloc
        nftables
        usbguard
        polkit

        # --- desktop ---------------------------------------------------------
        plasma-desktop
        plasma-wayland-session
        sddm
        kwallet-pam
        xdg-desktop-portal
        xdg-desktop-portal-kde
        pipewire
        pipewire-pulse
        wireplumber
        networkmanager
        power-profiles-daemon

        # --- the escape valves, which have to be present or they are not
        #     escape valves ---------------------------------------------------
        flatpak
        podman
        distrobox
        bubblejail
        firefox

        # --- recovery --------------------------------------------------------
        restic
        borg
        age
        rsync
        vim
        less
        man-db
