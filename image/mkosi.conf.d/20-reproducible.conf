# Reproducibility.
#
# The claim is: same manifest + same snapshot pin => same image hash. That claim
# is checkable (`steelctl history` records the hash, and CI builds twice and
# compares), which means it has to actually be true rather than approximately
# true.
#
# Four things break it if left alone, and each is handled below.

[Content]
# 1. Timestamps. Every mtime in the image comes from SOURCE_DATE_EPOCH, derived
#    by build.sh from the snapshot date rather than from the wall clock.
Environment=
        SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH
        TZ=UTC
        LC_ALL=C.UTF-8

# 2. Machine identity. A generated machine-id makes every build unique. The
#    first-boot mechanism generates one per installed machine, at install time,
#    which is also correct for the deniability design — two volumes must look
#    like two machines, and a machine-id baked into a shared image would make
#    them look like one.
MachineId=firstboot

# 3. Caches and indexes built at image time embed the order they were built in.
#    Rebuilt deterministically post-install by first-boot units instead.
RemoveFiles=
        /var/cache/ldconfig
        /var/lib/pacman/sync
        /var/log/*
        /etc/machine-id
        /etc/ssh/ssh_host_*

# 4. Package installation order. mkosi sorts the package list, but pacman hooks
#    can still write order-dependent output; the postinst script normalises what
#    it can and CI's twice-build comparison catches what it cannot.
[Output]
# Deterministic filesystem: erofs with a fixed block size and no compression
# dictionary training, which is otherwise seeded non-deterministically.
Format=disk
CompressOutput=no
