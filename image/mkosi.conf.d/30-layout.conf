# Partition and filesystem layout.
#
# The core design decision, from CLAUDE.md:
#
#   /usr        read-only, dm-verity verified   image slot A/B
#   /etc        writable overlay, reconciled    on /var
#   /var        writable, encrypted             LUKS2
#   /home       per-user encrypted              systemd-homed LUKS images
#   /opt,/srv   writable                        on /var (symlinked)
#   /tmp        tmpfs nodev,nosuid,noexec       RAM
#   /           read-only                       verity image
#
# Two consequences to design around:
#
#   * `pacman -S` at runtime is impossible by construction. This is the
#     enforcement mechanism for declarative package management — not a policy a
#     determined user bypasses in a terminal.
#
#   * A/B doubles root storage. Slots are sized deliberately below and the
#     minimum disk size is documented, because discovering this mid-update is a
#     bad way to find out.

[Content]
# Everything writable is a symlink into /var, so the set of writable locations
# is small and enumerable — which is what makes "an attacker has nowhere to
# persist" a checkable statement rather than a hope.
MakeInitrd=no

[Output]
SplitArtifacts=yes
