# SteelOS image build.
#
# Produces, from a pinned Arch snapshot:
#   * a read-only erofs root image
#   * a dm-verity hash tree over it, and the resulting root hash
#   * a UKI containing kernel + initramfs + cmdline, where the cmdline carries
#     that root hash
#   * signatures over the UKI and the verity root hash
#
# The crux is the third item. Signing the UKI signs the identity of the entire
# root filesystem, because the root hash is inside the thing being signed. That
# is what makes this verified boot of the OS rather than verified boot of the
# kernel.
#
# Reproducibility: same manifest + same snapshot pin => same image hash. The
# snapshot pin is not optional. Building against "current" makes reproducibility
# a lie, and Arch moves every day.

[Distribution]
Distribution=arch
# Overridden by build.sh from the manifest's snapshot field. Present here so a
# bare `mkosi` run is pinned too rather than silently tracking current.
Mirror=https://archive.archlinux.org/repos/2026/07/20/

[Output]
Format=disk
ManifestFormat=json
OutputDirectory=out
CacheDirectory=cache
# The image name carries the generation identity so two slots never collide.
ImageId=steelos
Output=steelos

[Content]
Bootable=yes
Bootloader=systemd-boot
BiosBootloader=none

# The kernel command line, baked into the UKI.
#
# roothash= is appended by build.sh after the verity tree exists — it cannot be
# known before the image is built, and that ordering is the whole design.
#
# module.sig_enforce=1 and lockdown=confidentiality are safe here and only here:
# out-of-tree modules are built and signed during this build, so there is no
# DKMS-at-runtime path to break. That is a direct advantage of the image model
# over a mutable one.
KernelCommandLine=
        rw
        systemd.verity=yes
        slab_nomerge
        init_on_alloc=1
        init_on_free=1
        page_alloc.shuffle=1
        randomize_kstack_offset=on
        vsyscall=none
        debugfs=off
        mitigations=auto
        lockdown=confidentiality
        module.sig_enforce=1
        lsm=landlock,lockdown,yama,integrity,apparmor
        apparmor=1
        security=apparmor
        intel_iommu=on
        amd_iommu=force_isolation
        iommu.passthrough=0
        quiet
        splash

KernelModulesInitrdExclude=.*

[Validation]
# Set by build.sh from the signing key material. Unsigned images do not boot
# under our own enrolled Secure Boot keys, which is the point.
SecureBoot=yes

[Build]
Environment=
        STEELOS_CHANNEL=stable
