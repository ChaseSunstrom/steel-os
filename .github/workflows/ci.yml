name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  steel-check:
    name: steel-check (build, test, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - run: rustup component add clippy rustfmt

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      # These include the consistency tests that compare the packaged sysctl,
      # modprobe and cmdline drop-ins against the tables steel-check audits
      # against. If they drift apart, the auditor reports on a baseline the
      # system was never configured with — so this gate is not optional.
      - name: Unit tests
        run: cargo test --all

      - name: Build release binary
        run: cargo build --release

      # Suite-level assertions: a configured system audits green, and the
      # deniability requirement holds byte for byte.
      - name: Audit assertions
        run: tests/audit/run.sh

  installer:
    name: Installer modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The comprehension check is the whole point of the threatened-user step.
      # Its logic decides whether someone has read limits that describe
      # irreversible, sometimes legal, consequences — so it gets a regression
      # test like anything else that matters.
      - name: Comprehension and validation logic
        run: python3 calamares/modules/threatened/test_comprehension.py

      - name: Modules parse
        run: |
          for module in calamares/modules/*/main.py; do
            python3 -c "import ast,sys; ast.parse(open('$module').read())" \
              || { echo "syntax error in $module"; exit 1; }
          done

  timing:
    name: Unlock-path timing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md: "Test this with a timing harness in CI, not by inspection."
      #
      # A comparison that returns early on the first differing byte looks fine
      # in review and leaks the matching prefix length over a few hundred
      # attempts. Only measurement finds that, and the whole deniability design
      # assumes an examiner cannot tell which credential was entered.
      - name: Measure the credential paths
        run: STEELOS_TIMING_SAMPLES=300 tests/vm/timing-harness.sh

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: |
          # Every shell script we ship. The .install files are pacman scriptlets
          # sourced by bash, so they get checked too — a syntax error there
          # breaks package installation with no useful message.
          find tools packages tests -type f \
            \( -name '*.sh' -o -name '*.install' -o -perm -u+x \) \
            ! -path '*/target/*' ! -path '*/out/*' -print0 \
          | xargs -0 --no-run-if-empty file --mime-type \
          | grep -E 'x-shellscript|x-sh' \
          | cut -d: -f1 \
          | xargs --no-run-if-empty shellcheck --severity=warning --shell=bash

  packages:
    name: Arch packages
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # makepkg refuses to run as root, so the container needs a build user.
      options: --user root
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust namcap sudo
          useradd -m build
          echo 'build ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - uses: actions/checkout@v4

      - name: Lint PKGBUILDs
        run: |
          chown -R build:build .
          fail=0
          for pkgbuild in packages/*/PKGBUILD; do
            echo "::group::$pkgbuild"
            # namcap on the PKGBUILD source, not the built package: most of our
            # packages install config files and have no compiled content, so
            # source linting is where the useful findings are.
            sudo -u build namcap "$pkgbuild" | tee /tmp/out
            # Informational notes are fine; warnings about missing dependencies
            # and errors are not.
            grep -E '^\S+ E: ' /tmp/out && fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Build config packages
        run: |
          # steel-check needs the Rust workspace and is built in the job above;
          # here we verify the config packages actually assemble.
          for pkg in steel-kernel-hardening steel-malloc steel-network \
                     steel-sandbox steel-apparmor steel-desktop steel-identity \
                     steel-backup steel-duress steel-custody steel-vault \
                     steel-boot steel-base; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && sudo -u build makepkg --nodeps --noconfirm --clean)
            echo "::endgroup::"
          done

      - name: Verify installed layout
        run: |
          # Install into a staging root and assert the files land where
          # steel-check expects to read them. A package that installs to the
          # wrong path passes its own build and fails silently on a real system.
          mkdir -p /tmp/stage
          for pkg in packages/*/*.pkg.tar.*; do
            [ -e "$pkg" ] || continue
            tar -C /tmp/stage -xf "$pkg" 2>/dev/null || true
          done
          missing=0
          for path in \
            etc/sysctl.d/99-steel-hardening.conf \
            etc/modprobe.d/99-steel-blacklist.conf \
            etc/nftables.conf \
            etc/systemd/resolved.conf.d/99-steel.conf \
            etc/NetworkManager/conf.d/99-steel-privacy.conf \
            var/lib/flatpak/overrides/global \
            usr/bin/steel-malloc \
            usr/bin/steel-network \
            usr/bin/steel-shell \
            usr/bin/steel-profile \
            usr/lib/steelos/captive-portal-helper \
            usr/bin/steel-boot \
            usr/bin/steel-duress \
            usr/bin/steel-decoy \
            usr/bin/steel-backup \
            usr/bin/steel-custody \
            usr/bin/steel-vault \
            usr/bin/steel-profile-manager \
            usr/lib/steelos/boot-complete-health.sh \
            usr/lib/systemd/system/steel-boot-complete.service \
            usr/lib/systemd/user/steel-backup.timer
          do
            if [ ! -e "/tmp/stage/$path" ]; then
              echo "missing from the built packages: $path"
              missing=1
            fi
          done
          exit $missing

  universal-shipping:
    name: Duress components ship unconditionally
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md gotcha 21: "Universal shipping of duress code is a hard
      # requirement, not a preference. Any conditional file, unit, or log line
      # that reveals configuration state defeats the deniability design. Audit
      # for this specifically."
      #
      # This is that audit. It is cheap and it catches the one class of change
      # that silently destroys the property: someone making an install
      # conditional because it seemed tidier.
      - name: steel-base depends on steel-duress
        run: |
          grep -q "'steel-duress'" packages/steel-base/PKGBUILD \
            || { echo "steel-duress is not a hard dependency of steel-base."; \
                 echo "A duress package installed only by people who want duress"; \
                 echo "features makes its own presence the evidence."; exit 1; }

      - name: The initramfs hook install is unconditional
        run: |
          # No `if`, no test, no conditional install in the packaging path.
          if grep -nE '^\s*(if|\[\[|test )' packages/steel-duress/PKGBUILD; then
            echo "packages/steel-duress/PKGBUILD contains a conditional."
            echo "Every install must get identical files, or the ones that differ"
            echo "identify the machines that configured something."
            exit 1
          fi

      - name: The hook has no early return
        run: |
          # An early return on an unconfigured machine would make it measurably
          # faster than a configured one.
          if grep -nE '^\s*return\s*$|^\s*exit 0' packages/steel-duress/src/initcpio-hook; then
            echo "The initramfs hook returns early."
            echo "On an unconfigured machine it must do the SAME work and take the"
            echo "SAME time as on a configured one."
            exit 1
          fi

      - name: No plaintext duress configuration paths
        run: |
          # steel-check audits the running system for this; this audits the
          # source, so a leak cannot be introduced and shipped in one commit.
          for forbidden in '/etc/steelos/duress.conf' '/etc/steelos/decoy.conf' \
                           '/efi/steelos/duress'; do
            if grep -rn --include='*.sh' --include='steel-*' --include='PKGBUILD' \
                 -F "$forbidden" packages/ tools/ | grep -v 'PLAINTEXT_LEAK_PATHS' \
                 | grep -v '^\s*#'; then
              echo "Source writes duress configuration to a plaintext path: $forbidden"
              exit 1
            fi
          done
