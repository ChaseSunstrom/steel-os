# The fallback entry. The live medium's only job is to boot on hardware we have
# never seen, so there has to be a path for the machines where KMS is what
# breaks — otherwise the answer to "the installer shows a black screen" is
# "use a different distribution".
title    SteelOS installer (%ARCH%, UEFI) — basic graphics
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset
