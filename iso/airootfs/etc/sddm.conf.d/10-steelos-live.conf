# Autologin into the live session.
#
# X11, not Wayland, and this is a deliberate difference from the installed
# system. The medium's job is to boot on hardware nobody here has seen, and on
# that axis X11 is the more forgiving of the two: it runs where a compositor
# that requires working GL does not, which in practice means virtual machines
# and old or unusual graphics hardware — exactly the machines a live installer
# gets used on.
#
# The system this installs runs Plasma on Wayland. The medium that installs it
# does not have to.
[Autologin]
User=live
Session=plasmax11.desktop
Relogin=true

[General]
DisplayServer=x11

[Theme]
Current=breeze
