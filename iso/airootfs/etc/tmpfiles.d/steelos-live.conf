# The live session's home, and a visible way into the installer.
#
# Created here rather than shipped in the profile because an empty directory is
# not something git can track: it would exist in a working tree and be absent
# from a fresh checkout, so the ISO would build on the machine it was written on
# and fail everywhere else.
#
# 0700 because the live medium follows the same rule as the installed system —
# a home directory is not group- or world-readable, and steel-check asserts it.
d /home/live 0700 live live -
d /home/live/Desktop 0700 live live -

# A launcher on the desktop. The installer also autostarts and is in the
# application menu, but an autostart entry that fails leaves no trace on screen,
# and "there is no way to start the installer" is the worst thing a live medium
# can be. Three routes to one script.
C /home/live/Desktop/steelos-install.desktop 0755 live live - /usr/share/applications/steelos-install.desktop
