# The live session's home.
#
# Created here rather than shipped in the profile because an empty directory is
# not something git can track: it would exist in a working tree and be absent
# from a fresh checkout, so the ISO would build on the machine it was written on
# and fail everywhere else.
#
# 0700 because the live medium follows the same rule as the installed system —
# a home directory is not group- or world-readable, and steel-check asserts it.
d /home/live 0700 live live -
