# Initramfs for the LIVE MEDIUM only. The installed system's initramfs is built
# into a signed UKI by steel-boot and looks nothing like this.
#
# The PXE hooks the Arch releng profile carries are deliberately absent: they
# exist to net-boot an install medium, and every one of them is code that runs
# before anything is verified, on an unconfigured machine, on an unknown
# network. The one thing the live ISO is allowed to be is small.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
