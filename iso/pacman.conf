# pacman configuration used to build the SteelOS live ISO.
#
# This is the configuration mkarchiso pacstraps the live environment with. It is
# NOT the configuration of an installed SteelOS system — an installed system has
# a read-only /usr and no runtime pacman path at all.
#
# @STEELOS_REPO@ is substituted by iso/build.sh with the directory holding the
# freshly built steel-* packages. Build the ISO through that script rather than
# calling mkarchiso on this directory directly, or the placeholder is all pacman
# will see.

[options]
HoldPkg      = pacman glibc
Architecture = auto

ParallelDownloads = 5

# Official packages must be signed. The local SteelOS repo below is built from
# this checkout moments earlier by the same job, so it is trusted by
# construction rather than by signature; the packages that ship to users are
# signed by the release pipeline, which is a different path entirely.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Packages built from packages/ in this repository, plus the Calamares build.
# Placed last so an official package of the same name always wins — a local
# build shadowing something from core is the kind of surprise that only shows up
# in the shipped ISO.
[steelos]
SigLevel = Optional TrustAll
Server = file://@STEELOS_REPO@
