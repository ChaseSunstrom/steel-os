SERIAL 0 115200
UI menu.c32
MENU TITLE SteelOS installer

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 5
MENU VSHIFT 10
MENU TABMSGROW 12
MENU CMDLINEROW 12
MENU HELPMSGROW 14
MENU HELPMSGENDROW 28

MENU CLEAR
MENU IMMEDIATE

DEFAULT steelos
TIMEOUT 100

LABEL steelos
TEXT HELP
Boot the SteelOS installer on BIOS firmware.
ENDTEXT
MENU LABEL SteelOS installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# See the UEFI entries for why a basic-graphics path exists at all: a live
# medium that cannot boot on unfamiliar hardware is a live medium that cannot
# install anything.
LABEL steelosnomodeset
TEXT HELP
Boot the SteelOS installer with kernel mode setting disabled.
Use this when the normal entry reaches a black screen.
ENDTEXT
MENU LABEL SteelOS installer (%ARCH%, BIOS) — ^basic graphics
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power off
COM32 poweroff.c32
